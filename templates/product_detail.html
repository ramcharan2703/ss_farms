{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container py-5">

    <div class="row">

        <div class="col-lg-6">

            <img src="{{ product.image.url }}"
                 class="img-fluid rounded shadow">

        </div>

        <div class="col-lg-6">

            <span class="badge bg-success">
                {{ product.status }}
            </span>

            <h1 class="mt-3">
                {{ product.name }}
            </h1>

            <h3 class="text-success">
                ₹{{ product.price }}
            </h3>

            <p>
                {{ product.description }}
            </p>

            <p>
                <strong>Category:</strong>
                {{ product.category }}
            </p>

            <p>
                <strong>Stock:</strong>
                {{ product.stock }}
            </p>

            <a href="https://wa.me/{{ product.whatsapp_number }}"
               class="btn btn-success btn-lg"
               target="_blank">

                WhatsApp Now

            </a>

        </div>

    </div>

</div>

{% endblock %}
